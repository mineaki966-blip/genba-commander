<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>現場コマンダー</title>
<meta name="description" content="MCLSのCSCATTTに沿って多数傷病者事故の指揮を学ぶ訓練ゲーム（教育用の架空シナリオ）">
<meta name="theme-color" content="#10142a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="現場コマンダー">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=BIZ+UDPGothic:wght@400;700&family=DotGothic16&display=swap">
<style>
/* Layout: one-screen game. HUD (CSCATTT track + trust) on top, stage fills the rest. CSCA = debate scenes, TTT = turn-based aid-station simulation with the patient board in the middle and the turn button docked at the bottom. Single dark "night scene" look by design. */
:root{
  --night:#10142a; --panel:#1a2042; --panel-2:#232a55; --line:#353e74;
  --fg:#eef0fb; --muted:#a3a9cf;
  --siren:#ff3d5f; --weak:#ffae1f; --ok:#36d39a;
  --paper:#f4f1e6; --paper-ink:#1b1b22; --paper-line:#d9d3bf; --paper-mute:#6a6656; --paper-blue:#3c3a96;
  --tag-g:#2fae63; --tag-y:#efc12f; --tag-r:#e3343a; --tag-k:#0a0a0f; --tag-n:#8d8a7c;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-sys:"DotGothic16","BIZ UDPGothic",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.7;margin:0;
  background-image:radial-gradient(120% 60% at 50% -10%, #2a1e4a 0%, transparent 60%),repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 2px, transparent 2px 4px);}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--weak);outline-offset:2px}
#app{height:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;padding-block:10px 12px;gap:10px}

.hud[hidden]{display:none}
.hud{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:'track track track' 'hearts ev snd';align-items:center;gap:6px 8px}
.track{grid-area:track}.hearts{grid-area:hearts}.evbtn#evbtn{grid-area:ev}.sndbtn{grid-area:snd}
.track{display:flex;gap:3px;min-width:0}
.track span{flex:1;text-align:center;font-family:var(--f-display);font-size:15px;padding:3px 0 1px;border-bottom:3px solid var(--line);color:var(--muted);line-height:1.2}
.track span small{display:block;font-family:var(--f-body);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.track span.done{color:var(--fg);border-color:var(--ok)}
.track span.now{color:var(--siren);border-color:var(--siren)}
.hearts{display:flex;align-items:center;gap:4px;font-family:var(--f-sys);font-size:12px;color:var(--muted);min-width:0}
.hearts i{width:10px;height:10px;transform:rotate(45deg);background:var(--siren);display:inline-block;margin-left:3px;flex:none}
.hearts i.off{background:var(--line)}
.sndbtn{min-width:4.6em}
.sndbtn.on{border-color:var(--weak);color:var(--weak)}
.evbtn{font-family:var(--f-sys);font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 8px}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;overflow-x:hidden}

.talk{margin-top:auto;display:flex;flex-direction:column;gap:8px;cursor:pointer;user-select:none}
.portrait{align-self:flex-start}
.face{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 50% 35%, var(--c) 0 38%, transparent 39%),radial-gradient(ellipse at 50% 105%, var(--c) 0 55%, transparent 56%);border:2px solid var(--c);position:relative;opacity:.95}
.face b{position:absolute;bottom:-6px;right:-6px;font-family:var(--f-display);font-weight:400;font-size:20px;background:var(--night);border:2px solid var(--c);color:var(--c);width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.box{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:12px 14px 10px;position:relative;min-height:128px}
.name{display:inline-block;font-weight:700;font-size:14px;background:var(--c,var(--muted));color:var(--night);padding:1px 10px;border-radius:3px;margin-bottom:6px}
.name small{font-weight:400;margin-left:6px}
.line{margin:0;font-size:17px;min-height:3.4em;white-space:pre-wrap}
.nxt{position:absolute;right:12px;bottom:6px;color:var(--weak);font-size:13px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.narr .box{border-style:dashed;background:transparent}
.narr .line{color:#d9dcf2}

.title{margin:auto 0;display:flex;flex-direction:column;gap:18px;padding-block:20px}
.kicker{font-family:var(--f-sys);color:var(--weak);letter-spacing:.12em;font-size:13px}
.title h1{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,14vw,78px);line-height:1;margin:0;letter-spacing:-.02em}
.title h1 em{font-style:normal;color:var(--siren);display:block;font-size:.5em;letter-spacing:.06em;margin-top:8px}
.how{display:grid;gap:8px;font-size:14px;color:var(--muted)}
.how div{display:grid;grid-template-columns:3.6em 1fr;gap:8px}
.how b{font-family:var(--f-display);font-weight:400;color:var(--fg)}
.primary{background:var(--siren);color:#fff;border:0;border-radius:4px;padding:14px 18px;font-family:var(--f-display);font-size:19px;letter-spacing:.06em}
.primary:disabled{opacity:.4}
.ghost{background:transparent;border:1px solid var(--line);border-radius:4px;padding:10px 14px}
.sm{padding:4px 10px;font-size:13px}
.btns{display:flex;flex-direction:column;gap:8px}

.chap{margin:auto 0;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding-block:24px;border-top:2px solid var(--siren);border-bottom:2px solid var(--siren);animation:slidein .5s ease-out}
.chap .no{font-family:var(--f-sys);color:var(--muted);font-size:13px}
.chap .big{font-family:var(--f-display);font-size:96px;line-height:1;color:var(--siren)}
.chap h2{font-family:var(--f-display);font-weight:400;font-size:34px;margin:0;line-height:1.2}
.chap p{margin:4px 0 0;color:var(--muted);font-size:15px}
.mode{align-self:flex-start;font-family:var(--f-sys);font-size:12px;border:1px solid var(--weak);color:var(--weak);padding:0 8px;border-radius:3px}
@keyframes slidein{from{transform:translateX(30px);opacity:.2}to{transform:none;opacity:1}}

.get{margin-top:auto;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.get .hd{font-family:var(--f-display);color:var(--weak);font-size:20px}
.evcard{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--weak);border-radius:4px;padding:10px 12px}
.evcard b{display:block;font-size:15px}
.evcard span{font-size:14px;color:var(--muted)}

.choice{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.q{font-weight:700;font-size:17px}
.opt{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:12px 14px;font-size:15px}
.opt.bad{border-color:var(--siren);opacity:.6}
.opt.good{border-color:var(--ok)}
.fb{background:var(--panel-2);border-radius:6px;padding:10px 12px;font-size:15px}
.fb.bad{border-left:5px solid var(--siren)} .fb.good{border-left:5px solid var(--ok)}

.debate{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dlabel{font-family:var(--f-display);color:var(--night);background:var(--siren);padding:0 8px;font-size:14px;transform:skewX(-10deg)}
.dtitle{font-weight:700;flex:1;min-width:0}
.dleft{font-family:var(--f-sys);font-size:12px;color:var(--weak)}
.arena{flex:1;min-height:210px;position:relative;border:2px solid var(--line);border-radius:6px;background:repeating-linear-gradient(115deg, rgba(255,61,95,.06) 0 14px, transparent 14px 28px), var(--panel);padding:14px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.spk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px}
.spk i{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);color:var(--c);font-style:normal;font-family:var(--f-display);display:grid;place-items:center;font-size:13px}
.stmt{font-size:clamp(19px,5.4vw,24px);font-weight:700;line-height:1.55;margin:0;animation:fly .45s ease-out}
@keyframes fly{from{transform:translateX(40%) skewX(-8deg);opacity:0}to{transform:none;opacity:1}}
.weak{background:none;border:0;padding:0 2px;color:var(--weak);font-weight:700;text-decoration:underline wavy;text-underline-offset:5px;font-size:inherit;line-height:inherit}
.weak.done{color:var(--ok);text-decoration:line-through;cursor:default}
.bar{position:absolute;left:0;bottom:0;height:3px;background:var(--siren);width:100%;transform-origin:left;animation:bar linear forwards}
.paused .bar{animation-play-state:paused}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.retort{position:absolute;left:10px;right:10px;bottom:12px;background:var(--night);border:1px solid var(--siren);border-radius:4px;padding:6px 10px;font-size:14px}
.ctrl{display:flex;align-items:center;gap:8px}
.ctrl button{background:var(--panel);border:1px solid var(--line);border-radius:4px;width:44px;height:36px}
.dots{display:flex;gap:5px;flex:1;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--fg)}
.guide{font-size:13px;color:var(--muted)}
.bullets{display:flex;flex-wrap:wrap;gap:6px}
.bul{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.bul.sel{border-color:var(--weak);background:var(--weak);color:var(--night)}

/* Ready / dojo sorting */
.ready{margin:auto 0;display:flex;flex-direction:column;gap:12px}
.ready h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;line-height:1.25}
.ready ul{margin:0;padding-left:1.2em;color:var(--muted);font-size:15px}
.sort{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.timer{font-family:var(--f-sys);font-size:22px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--siren)}
.srow{display:flex;align-items:center;gap:10px;font-family:var(--f-sys);font-size:13px;color:var(--muted)}
.srow span{flex:1}
.deck{flex:1;min-height:200px;display:grid;place-items:center;position:relative}
.tag{width:min(100%,360px);background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:12px 14px 14px;position:relative;touch-action:none;user-select:none;cursor:grab;box-shadow:0 10px 24px rgba(0,0,0,.45);transition:transform .28s ease, opacity .28s ease;animation:deal .25s ease-out}
.tag.drag{transition:none;cursor:grabbing}
.tag::before{content:"";position:absolute;top:10px;right:12px;width:12px;height:12px;border-radius:50%;background:var(--night)}
@keyframes deal{from{transform:translateY(-30px) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.tg-h{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--paper-line);padding-bottom:4px;margin-bottom:6px;padding-right:24px}
.tg-h b{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1}
.tg-h span{font-size:14px;flex:1}
.tobs{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:15px;margin:0}
.tobs dt{color:var(--paper-mute);font-size:13px;padding-top:2px}
.tobs dd{margin:0;font-weight:700;min-width:0}
.tg-n{margin:6px 0 0;font-size:14px;border-top:1px dashed var(--paper-line);padding-top:6px}
.flash{min-height:3.3em;font-size:14px;background:var(--panel);border-radius:4px;padding:6px 10px;border-left:5px solid var(--line)}
.flash.ok{border-left-color:var(--ok)} .flash.ng{border-left-color:var(--siren)}
.flash b{margin-right:6px}
.bins{display:grid;gap:6px;grid-template-columns:repeat(4,1fr)}
.bin{border:2px solid transparent;border-radius:6px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;min-height:76px;justify-content:center;color:#fff;transition:transform .12s}
.bin b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.2}
.bin small{font-size:11px;opacity:.9}
.bin .cnt{font-family:var(--f-sys);font-size:12px}
.bin.hot{border-color:#fff;transform:scale(1.04)}
.bin.pulse{animation:pulse .3s}
@keyframes pulse{50%{transform:scale(1.08)}}
.s0{background:var(--tag-k);border-color:#555;color:#fff} .s1{background:var(--tag-r);color:#fff} .s2{background:var(--tag-y);color:#222} .s3{background:var(--tag-g);color:#fff}
.res{display:grid;gap:6px}
.res div{background:var(--panel-2);border-radius:4px;padding:8px 10px;font-size:14px;border-left:5px solid var(--siren)}

/* Aid-station simulation */
.sim{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.simtop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.clock{font-family:var(--f-sys);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.turn{font-family:var(--f-sys);font-size:13px;color:var(--muted)}
.nexta{font-size:12px;color:var(--weak);flex:1;text-align:right;min-width:0}
.rrow{display:flex;flex-wrap:wrap;gap:4px;font-size:12px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums}
.chip.zero{opacity:.45}
.plist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:4px}
.grp{font-family:var(--f-sys);font-size:12px;color:var(--muted);margin-top:4px}
.pc{width:100%;text-align:left;background:var(--paper);color:var(--paper-ink);border:0;border-left:12px solid var(--tc);border-radius:4px;padding:6px 10px 7px;display:grid;grid-template-columns:auto 1fr auto;gap:0 10px;align-items:baseline}
.pc .id{font-family:var(--f-display);font-size:24px;line-height:1.1;grid-row:span 3}
.pc .ag{font-size:13px;font-weight:700}
.pc .ago{font-size:11px;color:var(--paper-mute);font-family:var(--f-sys)}
.pc .vl{grid-column:2/4;font-size:12.5px;font-variant-numeric:tabular-nums;line-height:1.5}
.pc .vl.unk{color:var(--paper-mute)}
.pc .who{grid-column:2/4;font-size:12px;color:var(--paper-blue);font-weight:700;line-height:1.5}
.pc.cpa{opacity:.7}
.simfoot{display:flex;gap:6px}
.simfoot .ghost{padding:10px 10px;font-size:14px}
.simfoot .primary{flex:1;font-size:17px;padding:12px}
.psh{gap:8px}
.psh .loc{font-size:12px;color:var(--muted)}
.vgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.vgrid div{background:var(--panel-2);border-radius:3px;padding:2px 6px;font-size:11px;color:var(--muted)}
.vgrid b{display:block;font-size:17px;color:var(--fg);font-variant-numeric:tabular-nums;line-height:1.3}
.vgrid b.red{color:var(--siren)}
.finds{margin:0;padding-left:1.1em;font-size:14px}
.tagbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tagbtns button{border:2px solid transparent;border-radius:4px;padding:8px 0;font-weight:700}
.tagbtns button.on{border-color:#fff;box-shadow:0 0 0 2px var(--weak)}
.stt{display:flex;flex-wrap:wrap;gap:4px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:7px 9px;text-align:left;font-size:14px;font-weight:700;line-height:1.35}
.act small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.act.dis{opacity:.5}
.act.dis small{color:var(--weak)}
.who-l{display:grid;gap:4px;font-size:14px}
.who-l div{display:flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:4px;padding:4px 8px}
.who-l span{flex:1;min-width:0}
.lbl{font-family:var(--f-sys);font-size:12px;color:var(--muted)}
.pick{display:grid;gap:6px}
.pick button{text-align:left;background:var(--panel-2);border:2px solid var(--line);border-radius:4px;padding:6px 10px;font-size:14px}
.pick button.on{border-color:var(--weak)}
.pick button:disabled{opacity:.4}
.err{color:var(--siren);font-size:13px;min-height:1.2em;margin:0}
.msgs{display:grid;gap:5px;font-size:14px;margin:0;padding:0;list-style:none}
.msgs li{background:var(--panel-2);border-radius:4px;padding:5px 9px}
.msgs li.bad{border-left:4px solid var(--siren)}
.msgs li.arr{border-left:4px solid var(--weak)}
.prow{background:var(--panel);border-radius:4px;padding:8px 10px;font-size:14px;border-left:8px solid var(--tc)}
.prow b{font-size:15px}
.prow .o{display:block;font-weight:700}
.prow .tip{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.prow .lg{display:block;color:var(--muted);font-size:12px;font-family:var(--f-sys);margin-top:4px;line-height:1.5}

.ov{position:fixed;inset:0;background:rgba(6,8,20,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--panel);border:2px solid var(--line);border-radius:8px;max-width:568px;width:100%;max-height:86%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.sheet h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--weak)}
.sheet p{margin:0}
.evlist{display:grid;gap:8px}
@keyframes hitf{from{opacity:.75}to{opacity:0}}
.hitflash{position:fixed;inset:0;background:radial-gradient(circle,#fff 0%,rgba(255,174,31,.6) 40%,transparent 75%);pointer-events:none;z-index:29;animation:hitf .45s ease-out forwards}
#stamp{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:30}
#stamp span{font-family:var(--f-display);font-size:clamp(70px,24vw,140px);color:var(--siren);-webkit-text-stroke:3px #fff;transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) .12s both;text-shadow:6px 6px 0 rgba(0,0,0,.5)}
@keyframes stamp{from{transform:scale(2.6) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--weak);color:var(--night);font-weight:700;padding:6px 14px;border-radius:4px;z-index:40;font-size:14px;max-width:90%}

.result{display:flex;flex-direction:column;gap:12px;padding-block:8px 16px}
.rank{font-family:var(--f-display);font-size:110px;line-height:1;color:var(--siren)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--panel);border-radius:4px;padding:8px;text-align:center;font-size:12px;color:var(--muted)}
.stats b{display:block;font-size:22px;color:var(--fg);font-variant-numeric:tabular-nums}
.recap{display:grid;gap:4px;font-size:14px}
.recap div{display:grid;grid-template-columns:2.2em 1fr;gap:6px}
.recap b{font-family:var(--f-display);font-weight:400;color:var(--siren)}
.note{font-size:12px;color:var(--muted)}
/* Portraits */
.pimg{width:150px;aspect-ratio:4/5;object-fit:cover;object-position:top;border-radius:6px;border:3px solid var(--c,var(--line));background:#f7f5ef;display:block;animation:slidein .35s ease-out}
.pimg.sm{width:96px;--c:var(--ok)}

/* ---- Shared state & UI helpers ---- */
let G;
function reset(){G={i:0,hearts:5,ev:new Set(),miss:0,chapter:-1,sim:null,over:[],sc:(G&&G.sc)||'bus',solo:false,inSim:false}}
reset();
const $=s=>document.querySelector(s), stage=$('#stage');
function hud(){
  $('#track').innerHTML=CS.map((c,k)=>`<span class="${k<G.chapter?'done':k===G.chapter?'now':''}">${c[0]}<small>${c[1]}</small></span>`).join('');
  $('#hearts').innerHTML='信頼'+[0,1,2,3,4].map(k=>`<i class="${k<G.hearts?'':'off'}"></i>`).join('');
  $('#evbtn').textContent='根拠カード '+G.ev.size;
}
function setChap(c){if(c>G.chapter){G.chapter=c;hud()}}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;const gd=document.getElementById('guide');e.style.top=gd&&!gd.classList.contains('bot')?(gd.getBoundingClientRect().bottom+8)+'px':'';clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2000)}
function stamp(t){sfx('stamp');setTimeout(()=>{const f=document.createElement('div');f.className='hitflash';document.body.appendChild(f);setTimeout(()=>f.remove(),450);const a=document.getElementById('app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake')},220);const e=$('#stamp');e.innerHTML=`<span>${t}</span>`;e.hidden=false;setTimeout(()=>e.hidden=true,1100)}
function sheet(h,body,btns){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><h3>${h}</h3>${body}<div class="btns">${btns.map((b,k)=>`<button class="${k?'ghost':'primary'}" data-k="${k}" type="button">${b[0]}</button>`).join('')}</div></div>`;
  document.body.appendChild(ov);ov.querySelector('.btns button').focus();
  ov.querySelectorAll('.btns button').forEach(x=>x.onclick=()=>{ov.remove();const cb=btns[x.dataset.k][1];cb&&cb()});
}
function next(){G.i++;render()}
let typing=null;
function type(el,text){clearInterval(typing);let n=0;el.textContent='';el._full=text;
  typing=setInterval(()=>{n++;el.textContent=text.slice(0,n);if(n>=text.length){clearInterval(typing);typing=null}},24)}
function talk(who,text,e){
  const c=who?CH[who]:null;
  const por=!c||who==='you'?'':c.img?`<div class="portrait"><img class="pimg" style="--c:${c.c}" src="${c.img[e]||c.img.n}" alt="${c.n}"></div>`:`<div class="portrait"><div class="face" style="--c:${c.c}"><b>${c.k}</b></div></div>`;
  stage.innerHTML=`<div class="talk ${c?'':'narr'}" id="tk">${por}
   <div class="box" style="${c?'--c:'+c.c:''}">${c?`<span class="name">${c.n}<small>${c.r}</small></span>`:''}<p class="line" id="ln"></p><span class="nxt">▼ タップ</span></div></div>`;
  const ln=$('#ln');type(ln,text);
  if(who==='cmd')sfx('radio');
  $('#tk').onclick=()=>{sfx('tap');if(typing){clearInterval(typing);typing=null;ln.textContent=ln._full}else next()};
}
function render(){
  stopDebate();stopSort();document.querySelector('.hud').hidden=false;
  const s=SC[G.sc].story[G.i];hud();stage.scrollTop=0;
  if(s.t==='result')clearSave();else if(s.t!=='title')saveGame();
  bgm(s.t==='title'?'title':s.t==='explore'||s.t==='interview'?'survey':s.t==='debate'?'meeting':s.t==='mapplace'?'map':s.t==='sim'?'aid':s.t==='result'?'result':G.chapter<0?'dispatch':BGM.want);
  if(s.t==='title')return title();
  if(s.t==='narr')return talk(null,s.x);
  if(s.t==='say')return talk(s.w,s.x,s.e);
  if(s.t==='explore')return explore(s.id);
  if(s.t==='interview')return interview(s.id);
  if(s.t==='mapplace')return mapPlace(s.id);
  if(s.t==='chap'){sfx('chap');setChap(s.i);const c=CS[s.i];
    stage.innerHTML=`<div class="chap" id="ck"><span class="no">CSCATTT ${s.i+1}/7</span><span class="big">${c[0]}</span><h2>${c[1]}<br><small style="font-size:.5em;color:var(--muted)">${c[2]}</small></h2><p>${s.s}</p><span class="mode">${s.m}</span><span class="nxt" style="position:static;align-self:flex-end">▼ タップ</span></div>`;
    $('#ck').onclick=next;return}
  if(s.t==='get'){sfx('get');s.ids.forEach(id=>G.ev.add(id));hud();
    stage.innerHTML=`<div class="get" id="gt"><span class="hd">根拠カード入手</span>${s.ids.map(id=>`<div class="evcard"><b>${EV[id][0]}</b><span>${EV[id][1]}</span></div>`).join('')}<span class="nxt" style="position:static;align-self:flex-end">▼ タップ</span></div>`;
    $('#gt').onclick=next;return}
  if(s.t==='choice')return choice(s);
  if(s.t==='debate')return debate(s.id);
  if(s.t==='sim')return simReady(false,s.id||'bus');
  if(s.t==='result')return result();
}

  $('#so').onclick=()=>{G.sc=titleSel;reset();G.chapter=4;document.querySelector('.hud').hidden=false;hud();simReady(true,G.sc)};
  const rs=$('#rs');if(rs)rs.onclick=resumeGame;
  $('#dj').onclick=dojo;$('#sndt').onclick=()=>setSound(!BGM.on);
  $('#how').onclick=()=>sheet('遊び方',`<ul class="msgs"><li><b>C・S・C・A</b><br>写真で現場を調べて根拠カードを集め、指揮ミーティングで隊員の判断を是正する。最後に拠点を地図に配置する。</li><li><b>T・T・T</b><br>ターン制の救護所シミュレーション。限られた人員・資器材・救急車で傷病者を救う。</li><li><b>トリアージ道場</b><br>START法の60秒仕分け。</li></ul><p class="note">教育用の架空シナリオです。実際の活動は各地域のプロトコル・MCLS標準に従ってください。</p>`,[['閉じる']]);
}
function choice(s){
  stage.innerHTML=`<div class="choice"><div class="q">${s.q}</div>${s.o.map((o,k)=>`<button class="opt" data-k="${k}" type="button">${o.l}</button>`).join('')}<div id="fb"></div></div>`;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const o=s.o[b.dataset.k];
    if(o.ok){sfx('good');b.classList.add('good');stage.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      $('#fb').innerHTML=`<div class="fb good">${o.fb}</div><div class="btns" style="margin-top:10px"><button class="primary" id="cn" type="button">次へ</button></div>`;$('#cn').onclick=next}
    else{sfx('wrong');G.miss++;b.classList.add('bad');b.disabled=true;$('#fb').innerHTML=`<div class="fb bad">${o.fb}</div>`}
  });
}

/* ---- Debate ---- */
let D=null;
function stopDebate(){if(D){clearTimeout(D.tm);D=null}}
const fmt=(t,solved)=>t.replace(/\[([^|\]]+)\|(\w+)\]/g,(m,s,id)=>`<button type="button" class="weak ${solved.has(id)?'done':''}" data-w="${id}">${s}</button>`);
const keys=d=>Object.keys(d.wk).filter(k=>d.wk[k].ans);
function debate(id){
  const d=DB[id];D={id,d,idx:0,solved:new Set(),bul:null,paused:false,tm:null,hold:false};
  stage.innerHTML=`<div class="debate"><div class="dhead"><span class="dlabel">指揮ミーティング</span><span class="dtitle">${d.title}</span><span class="dleft" id="left"></span></div>
   <div class="arena" id="arena"></div>
   <div class="ctrl"><button type="button" id="pv" aria-label="前の発言">◀</button><div class="dots" id="dots"></div><button type="button" id="ps" aria-label="一時停止">❚❚</button><button type="button" id="nx" aria-label="次の発言">▶</button></div>
   <div class="guide">根拠カードを選んでから、オレンジの言葉をタップして示す</div>
   <div class="bullets">${d.bullets.filter(b=>G.ev.has(b)).map(b=>`<button type="button" class="bul" data-b="${b}">${EV[b][0]}</button>`).join('')}</div>
   <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="ghost sm" id="evv" type="button">選んだカードの中身を見る</button><button class="ghost sm" id="nog" type="button">根拠が足りない（このまま進める）</button></div></div>`;
  $('#pv').onclick=()=>show(D.idx-1);$('#nx').onclick=()=>show(D.idx+1);
  $('#ps').onclick=()=>{D.paused=!D.paused;$('#ps').textContent=D.paused?'▶︎':'❚❚';show(D.idx)};
  stage.querySelectorAll('.bul').forEach(b=>b.onclick=()=>{D.bul=b.dataset.b;stage.querySelectorAll('.bul').forEach(x=>x.classList.toggle('sel',x===b))});
  $('#nog').onclick=()=>{D.hold=true;clearTimeout(D.tm);
    sheet('根拠がないまま進めますか？','<p>残っている誤りは是正されないまま活動が始まります。現場で集められなかった根拠は、あとから取り戻せません。</p>',[['このまま進める',giveUp],['ミーティングに戻る',()=>{D.hold=false;show(D.idx)}]])};
  $('#evv').onclick=()=>{if(!D.bul)return toast('先に根拠カードを選んでください');sheet(EV[D.bul][0],`<p>${EV[D.bul][1]}</p>`,[['閉じる']])};
  show(0);
}
function show(i){
  if(!D)return;const d=D.d,n=d.st.length;D.idx=(i+n)%n;clearTimeout(D.tm);
  const s=d.st[D.idx],c=CH[s.w],dur=4800,a=$('#arena');
  a.classList.toggle('paused',D.paused||D.hold);
  a.innerHTML=`<div class="spk">${c.img?`<img style="--c:${c.c}" src="${c.img.a||c.img.n}" alt="">`:`<i style="--c:${c.c}">${c.k}</i>`}${c.n}｜${c.r}</div><p class="stmt">${fmt(s.t,D.solved)}</p><div class="bar" style="animation-duration:${dur}ms"></div>`;
  $('#dots').innerHTML=d.st.map((_,k)=>`<i class="${k===D.idx?'on':''}"></i>`).join('');
  $('#left').textContent=`残りの誤り ${keys(d).length-D.solved.size}`;
  a.querySelectorAll('.weak').forEach(w=>w.onclick=e=>{e.stopPropagation();shoot(w.dataset.w)});
  if(!D.paused&&!D.hold)D.tm=setTimeout(()=>show(D.idx+1),dur);
}
function giveUp(){
  const left=keys(D.d).filter(k=>!D.solved.has(k));
  left.forEach(k=>{G.miss+=2;G.over.push(D.d.wk[k].miss)});
  sheet('その結果……',`<ul class="msgs">${left.map(k=>`<li class="bad">${D.d.wk[k].miss}</li>`).join('')}</ul>`,[['次へ',next]]);
}
function shoot(w){
  if(D.solved.has(w))return;
  if(!D.bul)return toast('先に下の根拠カードを選んでください');
  const wk=D.d.wk[w];
  if(wk.ans&&wk.ans.includes(D.bul)){
    D.solved.add(w);D.hold=true;clearTimeout(D.tm);stamp('是正！');
    const done=D.solved.size===keys(D.d).length;
    const bul=D.bul,dd=D;setTimeout(()=>{if(D!==dd)return;sheet('是正：'+EV[bul][0],`${(CH[D.d.st[D.idx].w].img||{}).s?'<img class="pimg sm" src="'+CH[D.d.st[D.idx].w].img.s+'" alt="">':''}<p>${wk.fb}</p>`,[[done?'ミーティングを終える':'ミーティングに戻る',()=>{if(done)next();else{D.hold=false;show(D.idx)}}]])},900);
  }else{
    sfx('wrong');G.hearts--;G.miss++;hud();const a=$('#arena');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');
    const c=CH[D.d.st[D.idx].w];
    a.insertAdjacentHTML('beforeend',`<div class="retort" style="border-color:${c.c}">${c.n}「${wk.ans?'その根拠では、判断は変えられませんよ':wk.fb}」</div>`);
    if(G.hearts<=0){D.hold=true;clearTimeout(D.tm);
      setTimeout(()=>sheet('信頼を失った……','<p>隊員たちがあなたの指示に迷い始めた。根拠カードの中身を確かめて、もう一度ミーティングに臨もう。</p>',[['ミーティングをやり直す',()=>{G.hearts=5;hud();debate(D.id)}]]),700)}
  }
}
$('#evbtn').onclick=()=>{
  const list=[...G.ev].map(id=>`<div class="evcard"><b>${EV[id][0]}</b><span>${EV[id][1]}</span></div>`).join('')||'<p class="note">まだ根拠カードはありません。</p>';

function vit(p){
  if(p.cpa)return{cpa:1};
  const h=Math.max(0,Math.min(1,p.hp/100)),g=p.good,b=p.bad;
  const jcs=p.hp>=55?g.jcs:p.hp>=30?Math.max(g.jcs,g.jcs<10?10:100):Math.max(g.jcs,200);
  let spo2=lerp(b.spo2,g.spo2,h);if(p.o2)spo2+=6;if(p.needs.airway&&airwayOK(p))spo2+=4;
  return{jcs,rr:Math.round(lerp(b.rr,g.rr,h)),hr:Math.round(lerp(b.hr,g.hr,h)),sbp:Math.round(lerp(b.sbp,g.sbp,h)),spo2:Math.min(100,Math.round(spo2))};
}
const redV=v=>v.jcs>=10||v.rr>=30||v.rr<10||v.hr>=120||v.hr<50||v.sbp<90||v.sbp>=200||v.spo2<90;

function arrivals(t,msgs){

  if(sc.length)msgs.push({c:'arr',x:`搬入：${sc.map(p=>p.id+'さん').join('、')}`});

function check(p,a){
  if(busyOn(p).some(s=>s.act===a.k))return{err:'実施中'};
  if(p.contam&&!['obs','jaw','o2','decon','selfdecon','cpr','order','iv'].includes(a.k))return{err:'除染が先（汚染されたまま処置はできない）'};
  if(p.contam&&a.k==='iv')return{err:'除染が先（汚染されたまま処置はできない）'};
  if(a.it&&SIM.items[a.it]<=0)return{err:`${ITN[a.it]}が残っていない`};
  const pool=SIM.staff.filter(s=>s.st==='free'&&ROLE[s.role]>=a.r).sort((x,y)=>ROLE[x.role]-ROLE[y.role]);
  if(pool.length<a.st)return{err:`空いている${RN[a.r]}${a.r<2?'以上':''}が${a.st}名必要`};
  const staff=pool.slice(0,a.st),isDoc=staff.some(s=>s.role==='doc');
  if(a.sp&&!isDoc){
    if(!(p.order||docHere()))return{err:'先に指示要請が必要'};
    if(a.k==='iv'){const v=vit(p);if(!(p.cpa||p.crush||v.sbp<90||v.hr>=120))return{err:'救命士の心停止前輸液はショック・クラッシュ症候群疑いが対象'}}
  }
  if(a.k==='glu'){if(!p.bglKnown)return{err:'先に血糖測定が必要'};if(p.bgl>=50)return{err:'血糖値50以上のため適応なし'}}
  if(a.k==='adr'&&!holders(p,'cpr').length)return{err:'CPR実施中であることが条件'};
  return{staff};
}
function doAct(p,a){
  const r=check(p,a);if(r.err)return toast(r.err);
  r.staff.forEach(s=>{s.st=a.hold?'hold':'act';s.pid=p.id;s.act=a.k;s.left=a.t||0});
  if(a.it)SIM.items[a.it]--;
  const nm=r.staff.map(s=>s.n).join('・');
  if(a.hold)lg(p,`${a.n.replace(/（.*）/,'')}開始（${nm}）`);
  setTimeout(()=>guide('act'),0);sfx('act');toast(`${nm} → ${p.id}さん：${a.n}${a.hold?'':'（このターン）'}`);
  renderP();
}
function release(s){
  const p=P(s.pid);
  if(s.act==='cpr'&&holders(p,'cpr').length===2){holders(p,'cpr').forEach(h=>{h.st='free';h.pid=null;h.act=null});SIM.items.bvm++;lg(p,'CPR中止');return}
  if(s.st==='act'){const a=ACT(s.act);if(a.it)SIM.items[a.it]++}
  if(s.act==='jaw')lg(p,`気道確保を解除（${s.n}）`);
  s.st='free';s.pid=null;s.act=null;
}

     ${needCrew?`<div class="lbl">同乗させる人員を2名（救護所から離脱する）</div><div class="pick">${freeS.map(s=>`<button type="button" data-s="${s.id}" class="${crew.has(s.id)?'on':''}">${s.n}（${RN[ROLE[s.role]]}）</button>`).join('')||'<p class="note">空いている人員がいない。</p>'}</div>`:''}

    ov.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const id=b.dataset.p;err='';if(sel.has(id))sel.delete(id);else{sel.add(id);if(sel.size>maxN()){sel.delete(id);err='これ以上は乗せられない'}}draw()});
    ov.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{hid=b.dataset.h;err='';draw()});
    ov.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const id=b.dataset.s;err='';if(crew.has(id))crew.delete(id);else if(crew.size<2)crew.add(id);draw()});
    ov.querySelector('#cx').onclick=()=>{ov.remove();simRender()};
    ov.querySelector('#go').onclick=()=>{
      const h=SIM.hosp.find(x=>x.id===hid);

      else if(needCrew&&crew.size<2)err='同乗する人員を2名選んでください';

function depart(v,pids,hid,crewIds){
  const h=SIM.hosp.find(x=>x.id===hid),T=v.heli?v.ft:h.t;
  const crewS=crewIds.map(id=>SIM.staff.find(s=>s.id===id));
  crewS.forEach(s=>s.st='gone');
  pids.forEach(id=>{
    const p=P(id);
    busyOn(p).forEach(s=>release(s));
    if(p.o2)SIM.items.o2++;
    const cat=trueCat(p);
    const skip=v.heli?['o2','co','airway','bleed','shock','chest','glucose','crush','supine','burnair','mi']:['o2','co','airway','bleed','supine'];
    let r=p.base*(v.heli?.5:1);for(const k in p.needs)if(!skip.includes(k)&&!satisfied(p,k))r+=p.needs[k];
    const died=p.hp-r*T*.7<=0;
    let pen=0,note='';
    const prefOK=p.pref&&h.id===p.pref;
    if(prefOK){}
    else if(cat===1&&h.lv<3){pen=2;note='赤を三次以外へ搬送'}
    else if(cat===3&&h.lv===3){pen=1;note='緑で三次の枠を使用'}
    else if(cat===2&&h.lv===3){pen=1;note='黄で三次の枠を使用'}
    else if(cat<3&&h.lv===1){pen=2;note='緑用の医療機関へ黄・赤を搬送'}
    if(cat===3&&!v.bus&&!v.heli&&h.lv>1&&SIM.t<10&&!note){note='早い段階で緑に救急車を使用'}
    if(p.pref&&h.id!==p.pref&&!note){pen+=1;note=p.prefWhy}
    p.out={via:v.n,h:h.n,dep:SIM.t,arr:SIM.t+T,died,cat,pen,note};
    h.used++;p.loc='gone';
    lg(p,`${v.n}で${h.n}へ出発（${fmtT(SIM.t+T)}着${died?'・搬送中に心停止':''}）`);
  });
  v.gone=true;SIM.departed++;setChap(6);
  sfx('depart');toast(`${v.n} 出発：${pids.map(x=>x+'さん').join('、')} → ${h.n}`);
  simRender();
}
function endTurn(){
  if(GD.on){const st=GSTEPS[GD.i];if(st&&st.on!=='turn'&&GD.i<5)GD.i=5}guide('turn');
  if(!SIM||SIM.done)return;
  const msgs=[],t=SIM.t;
  const mon=new Set(SIM.staff.filter(s=>(s.st==='act'||s.st==='hold')&&s.pid).map(s=>s.pid));
  const prev={};SIM.pts.forEach(p=>prev[p.id]=p.snapCat);
  const doneSet=new Set();
  SIM.staff.filter(s=>s.st==='act').forEach(s=>{
    s.left--;if(s.left>0)return;
    const p=P(s.pid),key=p.id+s.act;
    if(!doneSet.has(key)){doneSet.add(key);applyAct(s.act,p,s,msgs)}
    s.st='free';s.pid=null;s.act=null;
  });
  SIM.pts.forEach(p=>{
    if(p.loc!=='scene'&&p.loc!=='rescue')return;
    if(p.cpa){
      if(holders(p,'cpr').length){p.cprT=(p.cprT||0)+1;
        if(p.adr&&!p.black0&&Math.random()<.06){p.cpa=false;p.hp=20;p.needs={airway:6};p.base=2;msgs.push({c:'arr',x:`${p.id}さん：心拍再開（ROSC）`});lg(p,'心拍再開')}}
      return}
    p.hp-=rate(p);
    if(p.hp<=0){p.hp=0;p.cpa=true;p.diedT=t+1;
      busyOn(p).forEach(s=>release(s));if(p.o2){p.o2=false;SIM.items.o2++}
      msgs.push({c:'bad',x:`${p.id}さんが心肺停止（周囲の傷病者が叫んで知らせた）`});lg(p,'心肺停止');mon.add(p.id)}
  });
  SIM.pts.forEach(p=>{if(p.loc==='scene'&&!p.cpa&&p.arrT<t&&trueCat(p)===1&&p.tag!==1)p.underT++});
  SIM.t++;
  mon.forEach(id=>{const p=P(id);if(p.loc==='gone')return;snap(p);
    if(!p.cpa&&p.snapCat===1&&prev[id]!==undefined&&prev[id]!==1){const v=p.snap;msgs.push({c:'bad',x:`${p.id}さんの容態が悪化（付いている隊員より）：JCS ${v.jcs}・脈 ${v.hr}・血圧 ${v.sbp}・SpO2 ${v.spo2}`})}});
  events(SIM.t,msgs);
  if(SIM.t>=SIM.maxT){finishSim();return}
  const title=`${fmtT(t)} → ${fmtT(SIM.t)}`;
  sfx('turn');setTimeout(()=>{if(msgs.some(m=>/心肺停止/.test(m.x)))sfx('flat');else if(msgs.some(m=>m.c==='bad'))sfx('alarm');if(msgs.some(m=>/救急\d|ドクターヘリ|マイクロバス/.test(m.x)&&m.c==="arr"))setTimeout(()=>sfx('siren'),300)},250);
  const body=msgs.length?`<ul class="msgs">${msgs.map(m=>`<li class="${m.c||''}">${m.x}</li>`).join('')}</ul>`:'<p class="note">特に報告なし。見ていない傷病者の変化は、観察しないとわからない。</p>';
  sheet(title,body,[['続ける',runPrompts]]);
}
function applyAct(k,p,s,msgs){
  const a=ACT(k);
  switch(k){
    case'obs':break;
    case'o2':p.o2=true;break;
    case'bleed':if(p.needs.bleed){p.sat.add('bleed')}break;
    case'spl':p.splint=true;if(p.id==='D')p.base=0;break;
    case'pel':p.pelOn=true;if(p.needs.pelvis)p.sat.add('pelvis');msgs.push({x:`${p.id}さん：骨盤固定具を装着`});break;
    case'bgl':p.bglKnown=true;SIM.items.meter++;msgs.push({x:`${p.id}さん：血糖 ${p.bgl} mg/dL`});break;
    case'order':p.order=true;msgs.push({x:`${p.id}さん：MC医から特定行為の指示を受けた`});break;
    case'iv':p.ivDone=true;p.sat.add('shock');p.sat.add('crush');msgs.push({x:`${p.id}さん：静脈路確保・輸液を開始${p.loc==='rescue'?'（救出前輸液）':''}`});break;
    case'glu':p.gluDone=true;if(p.needs.glucose){p.sat.add('glucose');p.hp=Math.min(100,p.hp+35);p.good.jcs=0;msgs.push({x:`${p.id}さん：ブドウ糖投与後、意識が回復`})}break;
    case'adr':p.adr=true;break;
    case'intub':p.intub=true;holders(p,'jaw').forEach(h=>{h.st='free';h.pid=null;h.act=null});msgs.push({x:`${p.id}さん：気管挿管。気道確保の張り付きを解除`});break;
    case'drain':p.drain=true;p.sat.add('chest');msgs.push({x:`${p.id}さん：胸腔ドレナージ完了`});break;
    case'decon':p.contam=false;p.sat.add('contam');msgs.push({x:`${p.id}さん：除染完了`});break;
    case'selfdecon':{const ws=SIM.pts.filter(q=>q.loc==='scene'&&q.contam&&walkNow(q));ws.forEach(q=>{q.contam=false;q.sat.add('contam');if(q!==p)lg(q,'自力除染（誘導）')});msgs.push({x:`自力除染を誘導：${ws.map(q=>q.id+'さん').join('、')}`});break}
    case'smr':p.smr=true;p.sat.add('spine');break;
    case'pos':p.posDone=true;p.sat.add('supine');msgs.push({x:`${p.id}さん：左側臥位にして血圧が持ち直した`});break;
  }
  lg(p,`${a.n}（${s.n}）`);
}

function simScore(){
  const ps=SIM.pts;
  const dead=ps.filter(p=>!p.black0&&((p.cpa&&p.loc!=='gone')||(p.out&&p.out.died)));
  const under=ps.reduce((a,p)=>a+p.underT,0);
  const pen=ps.reduce((a,p)=>a+(p.out?p.out.pen:0),0);
  const remRed=ps.filter(p=>(p.loc==='scene'||p.loc==='rescue')&&!p.cpa&&trueCat(p)===1);
  const redOut=ps.filter(p=>p.out&&p.out.cat===1&&!p.out.died);
  const avg=redOut.length?Math.round(redOut.reduce((a,p)=>a+p.out.arr*2,0)/redOut.length):null;
  const pts=dead.length*3+under*.5+pen+remRed.length*2;
  return{dead:dead.length,under,pen,remRed:remRed.length,avg,pts,rank:pts<=1?'S':pts<=4?'A':pts<=8?'B':'C'};
}

const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
let dojoNo=0;
function genStart(){
  dojoNo++;const id=String(dojoNo).padStart(2,'0'),ag=`${pick(['男','女'])} ${R(8,89)}`;
  const crtN=()=>(R(5,20)/10).toFixed(1);
  if(Math.random()<.22)return{id,ag,walk:'可',br:'あり',rr:String(R(14,26)),circ:`触知可／CRT ${crtN()}秒`,ob:'可',note:pick(['','擦過傷','足首の痛み','頭痛の訴え']),ans:3,why:'歩けるので緑'};
  if(Math.random()<.13){const ok=Math.random()<.5;
    return ok?{id,ag,walk:'不可',br:'なし → 気道確保で呼吸出現',rr:String(R(6,12)),circ:'触知弱い',ob:'不可',note:'',ans:1,why:'気道確保で呼吸が出たら赤'}
             :{id,ag,walk:'不可',br:'なし → 気道確保後も呼吸なし',rr:'—',circ:'—',ob:'—',note:'',ans:0,why:'気道確保後も呼吸なしで黒'}}
  const r=Math.random(),rr=r<.13?R(6,9):r<.27?R(30,40):r<.35?pick([10,29]):R(11,28);
  const c=Math.random(),noRad=c<.08,crt=c<.18?(R(25,40)/10):c<.25?2.0:R(8,19)/10;
  const obey=Math.random()>.14,reasons=[];
  if(rr>=30||rr<10)reasons.push(`呼吸数${rr}`);
  if(noRad)reasons.push('橈骨動脈触知不可');else if(crt>2)reasons.push(`CRT ${crt.toFixed(1)}秒`);
  if(!obey)reasons.push('従命不可');
  const ans=reasons.length?1:2;
  return{id,ag,walk:'不可',br:'あり',rr:String(rr),circ:noRad?'触知不可':`触知可／CRT ${crt.toFixed(1)}秒`,ob:obey?'可':'不可',note:'',ans,
    why:ans===1?`${reasons[0]}で赤`:(rr===10||rr===29||crt===2?'境界値は基準外（30以上・10未満・2秒超）なので黄':'赤の基準に該当なしで黄')};
}
const startCard=p=>`<div class="tg-h"><b>${p.id}</b><span>${p.ag}</span></div>
 <dl class="tobs"><dt>歩行</dt><dd>${p.walk}</dd><dt>呼吸</dt><dd>${p.br}</dd><dt>呼吸数</dt><dd>${p.rr}</dd><dt>循環</dt><dd>${p.circ}</dd><dt>従命</dt><dd>${p.ob}</dd></dl>${p.note?`<p class="tg-n">${p.note}</p>`:''}`;
const TB=[{id:'3',label:'緑',sub:'Ⅲ',cls:'s3'},{id:'2',label:'黄',sub:'Ⅱ',cls:'s2'},{id:'1',label:'赤',sub:'Ⅰ',cls:'s1'},{id:'0',label:'黒',sub:'0',cls:'s0'}];
let SS=null;
function stopSort(){if(SS){SS.done=true;cancelAnimationFrame(SS.raf);SS=null}}
function dojo(){bgm('dispatch');document.querySelector('.hud').hidden=false;
  dojoNo=0;stopDebate();stopSort();G.chapter=4;hud();
  stage.innerHTML=`<div class="ready"><span class="dlabel" style="align-self:flex-start">仕分けゲーム</span><h2>トリアージ道場（START法）</h2>

   <div class="btns"><button class="primary" id="st" type="button">開始（60秒）</button><button class="ghost" id="ck" type="button">START法を確認する</button></div></div>`;
  $('#st').onclick=runSort;$('#ck').onclick=()=>sheet(...CHEAT.start,[['閉じる']]);
}
function runSort(){
  stopSort();
  SS={left:60000,last:performance.now(),paused:false,item:null,n:0,ok:0,miss:[],raf:0,busy:false,done:false};
  stage.innerHTML=`<div class="sort">
   <div class="dhead"><span class="dlabel">仕分け</span><span class="dtitle">トリアージ道場</span><span class="timer" id="tm"></span></div>
   <div class="srow"><span id="prog"></span><button class="ghost sm" id="ch" type="button">START法</button></div>
   <div class="deck" id="deck"></div>
   <div class="flash" id="fl">カードを箱へドラッグするか、箱をタップ。</div>
   <div class="bins">${TB.map(b=>`<button type="button" class="bin ${b.cls}" data-b="${b.id}"><b>${b.label}</b><small>${b.sub}</small></button>`).join('')}</div></div>`;
  stage.querySelectorAll('.bin[data-b]').forEach(b=>b.onclick=()=>place(b.dataset.b));
  $('#ch').onclick=()=>{SS.paused=true;sheet(...CHEAT.start,[['戻る',()=>{if(SS){SS.paused=false;SS.last=performance.now()}}]])};
  nextItem();SS.raf=requestAnimationFrame(tick);
}
function tick(){
  if(!SS||SS.done)return;const now=performance.now();
  if(!SS.paused)SS.left-=now-SS.last;SS.last=now;
  const t=$('#tm');t.textContent=(Math.max(0,SS.left)/1000).toFixed(1);t.classList.toggle('low',SS.left<10000);
  if(SS.left<=0){finishSort();return}
  SS.raf=requestAnimationFrame(tick);
}
function nextItem(){
  if(!SS)return;const it=genStart();SS.item=it;SS.busy=false;
  $('#prog').textContent=`正解 ${SS.ok}　判定 ${SS.n}`;
  $('#deck').innerHTML=`<div class="tag" id="card">${startCard(it)}</div>`;
  drag($('#card'));
}
function binAt(x,y){return [...stage.querySelectorAll('.bin[data-b]')].find(b=>{const r=b.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom})}
function drag(card){
  let sx=0,sy=0,on=false,hot=null;
  card.onpointerdown=e=>{if(SS.busy)return;on=true;sx=e.clientX;sy=e.clientY;card.setPointerCapture(e.pointerId);card.classList.add('drag')};
  card.onpointermove=e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;card.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/25}deg)`;
    const b=binAt(e.clientX,e.clientY);if(b!==hot){hot&&hot.classList.remove('hot');hot=b;hot&&hot.classList.add('hot')}};
  const up=e=>{if(!on)return;on=false;card.classList.remove('drag');hot&&hot.classList.remove('hot');
    const b=binAt(e.clientX,e.clientY);hot=null;
    if(b&&Math.hypot(e.clientX-sx,e.clientY-sy)>12)place(b.dataset.b);else card.style.transform=''};
  card.onpointerup=up;card.onpointercancel=up;
}
function place(bid){
  if(!SS||SS.busy||!SS.item||SS.done)return;
  const it=SS.item,ok=+bid===it.ans,why=`${it.id}：${TAGN[it.ans]}。${it.why}`;
  SS.busy=true;SS.n++;const fl=$('#fl');
  sfx(ok?'good':'wrong');
  if(ok){SS.ok++;fl.className='flash ok';fl.innerHTML=`<b style="color:var(--ok)">○</b>${why}`}
  else{SS.left-=5000;SS.miss.push(why);fl.className='flash ng';fl.innerHTML=`<b style="color:var(--siren)">× −5秒</b>${why}`;
    const d=$('#deck');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}
  const card=$('#card'),target=stage.querySelector(`.bin[data-b="${it.ans}"]`);
  if(card&&target){const a=card.getBoundingClientRect(),b=target.getBoundingClientRect();
    card.style.transform=`translate(${b.left+b.width/2-a.left-a.width/2}px,${b.top+b.height/2-a.top-a.height/2}px) scale(.2)`;card.style.opacity='0';
    target.classList.remove('pulse');void target.offsetWidth;target.classList.add('pulse')}
  setTimeout(nextItem,ok?300:650);
}
function finishSort(){
  if(!SS||SS.done)return;SS.done=true;cancelAnimationFrame(SS.raf);const s=SS;
  let best=0;try{best=+localStorage.getItem('ronpa-dojo-best')||0;if(s.ok>best)localStorage.setItem('ronpa-dojo-best',s.ok)}catch(e){}
  sheet(`道場 結果：${s.ok}名 正解`,`<p>判定 ${s.n}名／正答率 ${s.n?Math.round(s.ok/s.n*100):0}%　${s.ok>best?'<b style="color:var(--weak)">自己ベスト更新</b>':`自己ベスト ${Math.max(best,s.ok)}名`}</p>
    ${s.miss.length?`<div class="res">${s.miss.slice(-6).map(m=>`<div>${m}</div>`).join('')}</div>`:''}`,
    [['もう一度',dojo],['タイトルへ',()=>{reset();G.i=0;render()}]]);
}

const GD={on:false,i:0};
function guideStart(){GD.on=true;GD.i=0;guideShow()}
function guideEnd(){GD.on=false;const g=$('#guide');g&&g.remove();document.querySelectorAll('.glow').forEach(e=>e.classList.remove('glow'));try{localStorage.setItem('gc-guide','done')}catch(e){}}
function guideShow(){
  document.querySelectorAll('.glow').forEach(e=>e.classList.remove('glow'));
  let g=$('#guide');if(!GD.on){g&&g.remove();return}
  const st=GSTEPS[GD.i];if(!st)return guideEnd();
  if(!g){g=document.createElement('div');g.id='guide';g.setAttribute('role','status');document.body.appendChild(g)}
  g.innerHTML=`<b>ガイド ${GD.i+1}/${GSTEPS.length}</b><p>${st.t}</p><div class="gbtns">${st.btn?`<button type="button" id="gnext">${st.btn}</button>`:''}<button type="button" class="sk" id="gskip">スキップ</button></div>`;
  const nb=$('#gnext');if(nb)nb.onclick=()=>{sfx('tap');GD.i++;guideShow()};
  $('#gskip').onclick=guideEnd;
  const tg=document.querySelector(st.sel);if(tg)tg.classList.add('glow');
  g.classList.remove('bot');
  if(tg){const r=tg.getBoundingClientRect(),gh=g.getBoundingClientRect().height;if(r.top<gh+24)g.classList.add('bot')}
}
function guide(ev){if(!GD.on)return;const st=GSTEPS[GD.i];if(st&&st.on===ev){GD.i++;setTimeout(guideShow,ev==='turn'?50:0)}else setTimeout(guideShow,0)}

/* ===================== 途中保存 ===================== */
const SAVEKEY='gc-save-v1';
function saveGame(){
  try{
    const g={...G,ev:[...G.ev]};
    const d={v:1,t:Date.now(),G:g,sim:null};
    if(G.inSim&&SIM&&!SIM.done){d.sim=JSON.stringify({...SIM,cfg:undefined,promptIds:SIM.prompts.map(v=>v.id),prompts:undefined},(k,v)=>v instanceof Set?{__set:[...v]}:v)}
    localStorage.setItem(SAVEKEY,JSON.stringify(d));
  }catch(e){}
}
function clearSave(){try{localStorage.removeItem(SAVEKEY)}catch(e){}}
function loadSave(){try{const d=JSON.parse(localStorage.getItem(SAVEKEY)||'null');if(!d||d.v!==1||!SC[d.G.sc])return null;return d}catch(e){return null}}
function saveLabel(d){
  const g=d.G,c=SC[g.sc];
  let where;
  if(d.sim){const o=JSON.parse(d.sim);where=`救護所 ${fmtTat(o)}`}
  else if(g.solo)where='救護所シミュレーション';
  else{const st=c.story[g.i]||{};where=g.chapter>=0?`${CS[g.chapter][0]}（${CS[g.chapter][1]}）の章`:'出場'}
  const ago=Math.max(1,Math.round((Date.now()-d.t)/60000));
  return{name:c.n,where,ago:ago<60?`${ago}分前`:ago<1440?`${Math.round(ago/60)}時間前`:`${Math.round(ago/1440)}日前`};
}
function fmtTat(o){const b=(SIMS[o.id]&&SIMS[o.id].start)||[16,0];const m=b[0]*60+b[1]+2*o.t;return `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`}
function resumeGame(){
  const d=loadSave();if(!d)return;
  G={...d.G,ev:new Set(d.G.ev)};titleSel=G.sc;
  document.querySelector('.hud').hidden=false;hud();
  if(d.sim){
    SIM=JSON.parse(d.sim,(k,v)=>v&&typeof v==='object'&&Array.isArray(v.__set)?new Set(v.__set):v);
    SIM.cfg=SIMS[SIM.id];SIM.prompts=(SIM.promptIds||[]).map(id=>SIM.veh.find(v=>v.id===id)).filter(Boolean);delete SIM.promptIds;
    bgm('aid');simRender();if(SIM.prompts.length)runPrompts();
  }else if(G.solo){simReady(true,G.sc)}
  else render();
}

/* ===================== 効果音（Web Audioで合成） ===================== */
const SE=(()=>{let ctx=null,master=null,noiseBuf=null;
 const init=()=>{if(ctx)return ctx;const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ctx=new C();master=ctx.createGain();master.gain.value=.5;const comp=ctx.createDynamicsCompressor();comp.threshold.value=-10;comp.ratio.value=6;master.connect(comp).connect(ctx.destination);
   noiseBuf=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return ctx};
 const ok=()=>{if(!BGM.on)return false;if(!init())return false;if(ctx.state==='suspended')ctx.resume();return true};
 const tone=(f,t0,dur,{type='sine',vol=.3,f2=null,att=.005}={})=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
   g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+att);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g).connect(master);o.start(t0);o.stop(t0+dur+.02)};
 const noise=(t0,dur,{vol=.2,freq=2000,q=1,type='bandpass'}={})=>{const n=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();n.buffer=noiseBuf;f.type=type;f.frequency.value=freq;f.Q.value=q;
   g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);n.connect(f).connect(g).connect(master);n.start(t0);n.stop(t0+dur+.02)};
 const P={
  tap(){const t=ctx.currentTime;tone(1100,t,.06,{type:'triangle',vol:.3});tone(2200,t,.03,{type:'sine',vol:.12});noise(t,.025,{vol:.12,freq:4000,q:1})},
  radio(){const t=ctx.currentTime;noise(t,.18,{vol:.18,freq:1800,q:.8});tone(1250,t+.16,.09,{type:'square',vol:.07})},
  get(){const t=ctx.currentTime;[784,988,1319].forEach((f,i)=>tone(f,t+i*.07,.35,{type:'triangle',vol:.16}))},
  chap(){const t=ctx.currentTime;noise(t,.45,{vol:.25,freq:600,q:.5,type:'lowpass'});tone(110,t,.6,{vol:.35,f2:55})},
  stamp(){const t=ctx.currentTime;
   /* ため：上昇するスウッシュ */
   const n=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();n.buffer=noiseBuf;n.loop=true;f.type='bandpass';f.Q.value=1.2;
   f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(5000,t+.22);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.2);g.gain.exponentialRampToValueAtTime(.0001,t+.26);
   n.connect(f).connect(g).connect(master);n.start(t);n.stop(t+.3);
   const h=t+.22;
   /* 一撃：重いキックとクラック */
   tone(180,h,.45,{vol:1,f2:38,att:.002});tone(90,h,.6,{type:'triangle',vol:.5,f2:40,att:.002});
   noise(h,.18,{vol:.55,freq:2500,q:.6});noise(h,.06,{vol:.4,freq:7000,q:.8});
   /* 決め：明るい上昇ファンファーレ */
   [[523,0],[659,.07],[784,.14],[1047,.21]].forEach(([fq,d])=>{tone(fq,h+.05+d,.18,{type:'square',vol:.07});tone(fq*2,h+.05+d,.14,{type:'triangle',vol:.05})});
   [1047,1319,1568].forEach(fq=>tone(fq,h+.33,1.1,{type:'triangle',vol:.09,att:.01}));
   /* きらめき */
   for(let i=0;i<6;i++)tone(2600+i*380,h+.36+i*.045,.18,{type:'sine',vol:.04})},
  wrong(){const t=ctx.currentTime;tone(160,t,.28,{type:'square',vol:.12,f2:110});tone(150,t+.12,.28,{type:'square',vol:.1,f2:100})},
  good(){const t=ctx.currentTime;tone(880,t,.12,{type:'triangle',vol:.16});tone(1320,t+.09,.25,{type:'triangle',vol:.16})},
  look(){const t=ctx.currentTime;tone(660,t,.1,{type:'sine',vol:.12,f2:990})},
  miss(){const t=ctx.currentTime;tone(300,t,.12,{type:'sine',vol:.08,f2:220})},
  place(){const t=ctx.currentTime;tone(520,t,.12,{type:'sine',vol:.2,f2:780})},
  act(){const t=ctx.currentTime;tone(990,t,.06,{type:'triangle',vol:.1});tone(1480,t+.05,.08,{type:'triangle',vol:.08})},
  turn(){const t=ctx.currentTime;noise(t,.22,{vol:.12,freq:900,q:.7});tone(440,t+.05,.15,{vol:.1})},
  alarm(){const t=ctx.currentTime;for(let i=0;i<3;i++){tone(960,t+i*.2,.12,{type:'square',vol:.09});}},
  flat(){const t=ctx.currentTime;tone(1000,t,1.4,{type:'sine',vol:.14,att:.01})},
  siren(){const t=ctx.currentTime;for(let i=0;i<4;i++)tone(i%2?770:960,t+i*.3,.29,{type:'square',vol:.05,att:.02})},
  depart(){const t=ctx.currentTime;tone(220,t,.6,{type:'sawtooth',vol:.06,f2:330});noise(t,.5,{vol:.08,freq:400,q:.6,type:'lowpass'})},
  rank(){const t=ctx.currentTime;tone(98,t,.5,{vol:.4,f2:60});[392,494,587,784].forEach((f,i)=>tone(f,t+.25+i*.09,.6,{type:'triangle',vol:.12}))},
  tick(){const t=ctx.currentTime;tone(2000,t,.03,{type:'square',vol:.04})}
 };
 return{play(n){try{if(ok()&&P[n])P[n]()}catch(e){}}};
})();

/* ===================== BGM ===================== */
const BGM_FILES={title:'bgm/The_Weight_of_a_Breath.mp3',dispatch:'bgm/Critical_Path.mp3',survey:'bgm/Unsolved_Presence.mp3',meeting:'bgm/Calculated_Momentum.mp3',map:'bgm/A_Map_of_Intent.mp3',aid:'bgm/The_Steady_Hand.mp3',result:'bgm/Where_the_Storm_Settles.mp3'};
const BGM={on:false,cur:null,el:null,want:'title',vol:.45};
try{BGM.on=localStorage.getItem('gc-bgm')==='1'}catch(e){}
function fade(a,to,ms,done){const from=a.volume,t0=performance.now();const st=()=>{const k=Math.min(1,(performance.now()-t0)/ms);a.volume=from+(to-from)*k;if(k<1)requestAnimationFrame(st);else done&&done()};st()}
function bgm(key){
  BGM.want=key;
  if(!BGM.on||BGM.cur===key)return;
  const old=BGM.el;BGM.cur=key;
  if(old)fade(old,0,700,()=>old.pause());
  if(!key){BGM.el=null;return}
  const a=new Audio(BGM_FILES[key]);a.loop=true;a.volume=0;a.preload='auto';BGM.el=a;
  a.play().then(()=>fade(a,BGM.vol,900)).catch(()=>{BGM.cur=null});
}
function setSound(on){
  BGM.on=on;try{localStorage.setItem('gc-bgm',on?'1':'0')}catch(e){}
  document.querySelectorAll('.sndbtn,#sndt').forEach(b=>{b.textContent=on?'♪ オン':'♪ オフ';b.classList.toggle('on',on)});
  if(on){BGM.cur=null;bgm(BGM.want)}else{const a=BGM.el;BGM.el=null;BGM.cur=null;if(a)fade(a,0,400,()=>a.pause())}
}
$('#sndbtn').onclick=()=>setSound(!BGM.on);
document.querySelectorAll('.sndbtn').forEach(b=>{b.textContent=BGM.on?'♪ オン':'♪ オフ';b.classList.toggle('on',BGM.on)});
document.addEventListener('pointerdown',()=>{if(BGM.on&&!BGM.el){BGM.cur=null;bgm(BGM.want)}},{capture:true});
document.addEventListener('visibilitychange',()=>{if(!BGM.el)return;if(document.hidden)BGM.el.pause();else if(BGM.on)BGM.el.play().catch(()=>{})});
render();
</script>
